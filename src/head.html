<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirchhoff Lab</title>
<meta name="description" content="Learn Kirchhoff's junction and loop rules step by step with random practice circuits.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M6 16h7m6 0h7M16 6v7m0 6v7' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ===================== tokens ===================== */
:root {
  color-scheme: light;
  --paper: #f5f2e9; --paper-2: #ece7da; --card: #fffdf8; --card-2: #f8f5ec;
  --ink: #1d2330; --ink-2: #454d5c; --muted: #737a88; --line: #dcd5c4; --line-2: #cbc3b0;
  --grid: rgba(60, 50, 20, .045);
  --wire: #262b36; --accent: #0f766e; --accent-2: #0b5d57; --accent-ink: #ffffff; --accent-soft: rgba(15, 118, 110, .1);
  --hot: #f08c00; --good: #2b8a3e; --good-soft: rgba(43, 138, 62, .12); --bad: #c92a2a; --bad-soft: rgba(201, 42, 42, .1); --warn: #d9480f; --warn-soft: rgba(217, 72, 15, .1);
  --c1: #1c6dd0; --c2: #e8590c; --c3: #2b8a3e; --c4: #9c36b5; --c5: #c2255c;
  --l1: #0b9aa6; --l2: #d99a00; --l3: #6a9e12;
  --vlo: #3b5bdb; --vhi: #e03131;
  --shadow: 0 1px 2px rgba(40, 30, 10, .06), 0 6px 22px rgba(40, 30, 10, .07);
  --shadow-lg: 0 2px 6px rgba(40, 30, 10, .08), 0 18px 48px rgba(40, 30, 10, .16);
  --serif: "STIX Two Text", Cambria, "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans: system-ui, "Segoe UI", -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, Consolas, "SF Mono", Menlo, monospace;
  --math: "STIX Two Math", "Cambria Math", "Latin Modern Math", "Noto Sans Math", math;
  --top: 54px; --bot: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #10141a; --paper-2: #161b23; --card: #181e27; --card-2: #1d2430;
    --ink: #e9e5da; --ink-2: #c0bbae; --muted: #8d929c; --line: #2b333f; --line-2: #3a4351;
    --grid: rgba(255, 255, 255, .03);
    --wire: #dcd7c9; --accent: #2bc4b1; --accent-2: #5fd8c8; --accent-ink: #05201c; --accent-soft: rgba(43, 196, 177, .12);
    --hot: #ffc53d; --good: #51cf66; --good-soft: rgba(81, 207, 102, .12); --bad: #ff6b6b; --bad-soft: rgba(255, 107, 107, .12); --warn: #ff922b; --warn-soft: rgba(255, 146, 43, .12);
    --c1: #5c9dff; --c2: #ff8a4c; --c3: #5fcf7a; --c4: #d08bf0; --c5: #ff6b9d;
    --l1: #22c3cf; --l2: #f5c040; --l3: #a3e046;
    --vlo: #5c7cfa; --vhi: #ff6b6b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 22px rgba(0, 0, 0, .25);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .35), 0 18px 48px rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #10141a; --paper-2: #161b23; --card: #181e27; --card-2: #1d2430;
  --ink: #e9e5da; --ink-2: #c0bbae; --muted: #8d929c; --line: #2b333f; --line-2: #3a4351;
  --grid: rgba(255, 255, 255, .03);
  --wire: #dcd7c9; --accent: #2bc4b1; --accent-2: #5fd8c8; --accent-ink: #05201c; --accent-soft: rgba(43, 196, 177, .12);
  --hot: #ffc53d; --good: #51cf66; --good-soft: rgba(81, 207, 102, .12); --bad: #ff6b6b; --bad-soft: rgba(255, 107, 107, .12); --warn: #ff922b; --warn-soft: rgba(255, 146, 43, .12);
  --c1: #5c9dff; --c2: #ff8a4c; --c3: #5fcf7a; --c4: #d08bf0; --c5: #ff6b9d;
  --l1: #22c3cf; --l2: #f5c040; --l3: #a3e046;
  --vlo: #5c7cfa; --vhi: #ff6b6b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 22px rgba(0, 0, 0, .25);
  --shadow-lg: 0 2px 6px rgba(0, 0, 0, .35), 0 18px 48px rgba(0, 0, 0, .45);
}

/* ===================== base ===================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  color: var(--ink); font-family: var(--serif); font-size: 18px; line-height: 1.55;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
p { margin: .55em 0; }
.small { font-size: 14.5px; color: var(--muted); font-family: var(--sans); }
.sans { font-family: var(--sans); }
kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--card); }

/* MathML */
math { font-family: var(--math); font-size: 1.08em; }
math[display="block"] { font-size: 1.22em; margin: .35em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.ci1 { color: var(--c1); } .ci2 { color: var(--c2); } .ci3 { color: var(--c3); } .ci4 { color: var(--c4); } .ci5 { color: var(--c5); }
.tx-boxed { border: 1.5px solid currentColor; border-radius: 4px; padding: 1px 6px; }
.tx-hl { background: var(--accent-soft); border-radius: 4px; padding: 0 3px; }
.tx-good { color: var(--good); } .tx-bad { color: var(--bad); } .tx-dim { color: var(--muted); }
.tx-err { color: var(--bad); }
.tx-cancel { background: linear-gradient(to top right, transparent calc(50% - 1px), var(--bad) calc(50% - 1px), var(--bad) calc(50% + 1px), transparent calc(50% + 1px)); }
mtable.mt-mat mtd { padding: .12em .45em; }
mtable.mt-al mtd:nth-child(odd) { text-align: right; } mtable.mt-al mtd:nth-child(even) { text-align: left; }

/* ===================== top bar ===================== */
.topbar {
  position: fixed; inset: 0 0 auto 0; height: var(--top); z-index: 30;
  display: flex; align-items: center; gap: 14px; padding: 0 14px;
  background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); font-family: var(--sans);
}
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--serif); font-weight: 700; font-size: 19px; white-space: nowrap; cursor: pointer; border: 0; background: none; padding: 4px; }
.brand svg { width: 26px; height: 26px; }
.lvl-chip { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; border: 0; cursor: pointer; }
.progress { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 0; overflow: hidden; }
.pdot { width: 30px; height: 6px; border-radius: 99px; background: var(--line); border: 0; padding: 0; cursor: pointer; transition: background .25s, transform .2s; flex: 0 1 30px; min-width: 8px; position: relative; }
.pdot:hover { transform: scaleY(1.6); }
.pdot.seen { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.pdot.on { background: var(--accent); }
.pdot .tip { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); font-size: 12px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s; }
.pdot:hover .tip { opacity: 1; }
.tools { display: flex; gap: 6px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { border-color: var(--line-2); color: var(--ink); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.txt { width: auto; padding: 0 10px; font-size: 13px; font-weight: 600; }

/* ===================== minimap ===================== */
.minimap {
  position: fixed; top: calc(var(--top) + 10px); right: 14px; z-index: 25; width: 216px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg);
  padding: 6px 8px 4px; cursor: zoom-in; width: 196px; transition: width .28s cubic-bezier(.2, .8, .2, 1), top .28s cubic-bezier(.2, .8, .2, 1), right .28s cubic-bezier(.2, .8, .2, 1), opacity .25s, transform .25s;
}
.minimap:hover { width: min(520px, 46vw); }
.minimap .mm-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--sans); font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.minimap .mm-head span:last-child { color: var(--accent); text-transform: none; letter-spacing: 0; }
.minimap .circ .lab, .minimap .circ .alab { font-size: 26px; }
body.on-exercise .minimap { opacity: 0; transform: translateY(-8px) scale(.96); pointer-events: none; }
.minimap.min { width: 132px; padding: 5px 10px; top: 12px; right: 150px; z-index: 35; box-shadow: none; }
.minimap.min #mmBody { display: none; }
.minimap.min .mm-head span:first-child { display: none; }
.minimap.min .mm-head span:last-child::before { content: 'Exercise '; }
.minimap.min .mm-head { justify-content: center; }
.minimap.min:hover { width: min(520px, 46vw); padding: 6px 8px 4px; box-shadow: var(--shadow-lg); }
.minimap.min:hover #mmBody { display: block; }
.minimap.min:hover .mm-head span:first-child { display: inline; }
.minimap.min:hover .mm-head span:last-child::before { content: none; }
.minimap.min:hover .mm-head { justify-content: space-between; }

/* ===================== stage & pages ===================== */
.stage { position: fixed; inset: var(--top) 0 var(--bot) 0; overflow: hidden; }
.page { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
.page.enter-f { animation: inF .42s cubic-bezier(.2, .8, .2, 1) both; }
.page.enter-b { animation: inB .42s cubic-bezier(.2, .8, .2, 1) both; }
.page.leave-f { animation: outF .3s ease both; pointer-events: none; }
.page.leave-b { animation: outB .3s ease both; pointer-events: none; }
@keyframes inF { from { opacity: 0; transform: translateX(48px); } to { opacity: 1; transform: none; } }
@keyframes inB { from { opacity: 0; transform: translateX(-48px); } to { opacity: 1; transform: none; } }
@keyframes outF { to { opacity: 0; transform: translateX(-40px); } }
@keyframes outB { to { opacity: 0; transform: translateX(40px); } }
@media (prefers-reduced-motion: reduce) { .page.enter-f, .page.enter-b, .page.leave-f, .page.leave-b { animation-duration: .01s; } }
.inner { max-width: 1340px; margin: 0 auto; padding: 18px 26px 40px; }
.ph { padding-right: 236px; margin-bottom: 14px; min-height: 112px; }
.kicker { font-family: var(--sans); font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.ph h1 { font-size: clamp(26px, 2.5vw, 36px); }
.lede { font-size: 17.5px; color: var(--ink-2); max-width: 74ch; margin-top: 6px; }
.fig .circ { max-height: max(300px, calc(100vh - var(--top) - var(--bot) - 190px)); }
.split { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.fig { position: sticky; top: 0; }
.txt > * + * { margin-top: 16px; }
@media (max-width: 1020px) {
  .split { grid-template-columns: 1fr; }
  .fig { position: static; }
  .ph { padding-right: 140px; }
  .minimap { width: 130px; }
}
@media (max-width: 640px) { .inner { padding: 16px 14px 32px; } .ph { padding-right: 0; padding-top: 70px; } body { font-size: 17px; } }

/* ===================== cards & controls ===================== */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
.card h3 { font-size: 20px; margin-bottom: 6px; }
.card h3 .num { font-family: var(--sans); font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; margin-right: 8px; vertical-align: 3px; }
.card.fig-card { padding: 10px 12px; }
.card.soft { background: var(--card-2); box-shadow: none; }
.callout { border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 12px 12px 0; padding: 10px 14px; }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); }
.callout.good { border-color: var(--good); background: var(--good-soft); }
.callout b:first-child { font-family: var(--sans); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--sans); font-size: 15px; font-weight: 600; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card); cursor: pointer; transition: transform .12s, background .2s, border-color .2s; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { border-color: var(--line-2); }
.btn.big { font-size: 17px; padding: 13px 22px; border-radius: 12px; }
.btn svg { width: 17px; height: 17px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 7px 13px; font-family: var(--sans); font-size: 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.hoverlist { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.hoverlist li { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); cursor: default; transition: border-color .2s, background .2s; }
.hoverlist li:hover, .hoverlist li.on { border-color: var(--accent); background: var(--accent-soft); }

/* ===================== bottom nav ===================== */
.botnav { position: fixed; inset: auto 0 0 0; height: var(--bot); z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(8px); font-family: var(--sans); }
.botnav .where { font-size: 14px; color: var(--muted); text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.botnav .where b { color: var(--ink); font-weight: 600; }
.botnav .btn { min-width: 120px; }
@media (max-width: 640px) { .botnav .where .hint { display: none; } .botnav .btn { min-width: 0; } }

/* ===================== circuit ===================== */
.circ { width: 100%; height: auto; display: block; overflow: visible; font-family: var(--serif); user-select: none; }
.circ .wire { fill: none; stroke: var(--wire); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; transition: stroke .5s, stroke-width .3s; }
.circ.pot .wire { stroke-width: 7; }
.circ .rbox { fill: var(--card); stroke: var(--wire); stroke-width: 3.2; stroke-linejoin: round; }
.circ .zig { fill: none; stroke: var(--wire); stroke-width: 3.2; stroke-linejoin: round; stroke-linecap: round; }
.circ .plate { stroke: var(--wire); stroke-linecap: butt; }
.circ .plate.plus { stroke-width: 3.4; } .circ .plate.minus { stroke-width: 8; }
.circ .pm { font: 700 18px var(--sans); fill: var(--muted); }
.circ .hit { fill: transparent; }
.circ .lab { font-size: 22px; fill: var(--ink); }
.circ .lab .sym, .circ .alab .sym { font-style: italic; }
.circ .sym.emf { font-family: var(--math); font-style: normal; }
.circ .lab .val { fill: var(--ink-2); }
.circ .ndot { fill: var(--wire); }
.circ .nlab { font: 700 26px var(--serif); fill: var(--ink); }
.circ .vlab { font: 700 19px var(--sans); fill: var(--accent); paint-order: stroke; stroke: var(--card); stroke-width: 5px; }
.circ .arrow { color: var(--c1); }
.circ .ahead { fill: currentColor; }
.circ .alab { font-size: 23px; font-weight: 700; fill: currentColor; paint-order: stroke; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; }
.circ .arrow.clickable { cursor: pointer; }
.circ .ahalo { fill: currentColor; opacity: .1; transition: opacity .2s; animation: halo 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.circ .arrow.clickable:hover .ahalo { opacity: .25; animation: none; }
@keyframes halo { 0%, 100% { opacity: .07; transform: scale(.85); } 50% { opacity: .2; transform: scale(1.05); } }
.circ .flow { fill: none; stroke-linecap: round; stroke-width: 7.5; stroke-dasharray: 0 26; opacity: .95; }
.circ .flow.nflow { stroke: var(--muted); }
.circ .flow.e { stroke: var(--vlo); stroke-width: 6; }
.circ .band { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 34; opacity: 0; transition: opacity .4s; }
.circ .band.show { opacity: .2; }
.circ [data-b], .circ [data-n] { transition: opacity .3s; }
.circ.focusing [data-b]:not(.on), .circ.focusing [data-n]:not(.on) { opacity: .14; }
.circ .hot { filter: drop-shadow(0 0 4px var(--hot)) drop-shadow(0 0 8px var(--hot)); }
.circ .loopind .larc { fill: none; stroke: currentColor; stroke-width: 3.6; stroke-linecap: round; }
.circ .loopind .lhead { fill: currentColor; }
.circ .loopind .lnum { font: 700 22px var(--sans); fill: currentColor; }
.circ .loopind .lhalo { fill: currentColor; opacity: .08; transition: opacity .2s; }
.circ .loopind.clickable { cursor: pointer; }
.circ .loopind.clickable:hover .lhalo { opacity: .2; }
.circ .nhit { fill: transparent; cursor: pointer; }
.circ .nhit:hover { fill: var(--accent-soft); }
.circ .walker .wdot { fill: currentColor; stroke: var(--card); stroke-width: 3; }
.circ .walker .wring { fill: currentColor; opacity: .25; animation: ring 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ring { from { transform: scale(.6); opacity: .45; } to { transform: scale(1.6); opacity: 0; } }
.circ .startflag { fill: none; stroke: var(--ink-2); stroke-width: 2.5; stroke-dasharray: 4 4; }

/* ===================== rollercoaster chart ===================== */
.coaster { width: 100%; height: auto; display: block; font-family: var(--sans); }
.coaster .cg { stroke: var(--line); stroke-width: 1; }
.coaster .cz { stroke: var(--ink-2); stroke-width: 1.2; stroke-dasharray: 4 4; }
.coaster .cax { font-size: 12px; fill: var(--muted); }
.coaster .cband { fill: var(--accent-soft); }
.coaster .cmark { font-size: 13px; font-weight: 700; fill: var(--ink-2); font-family: var(--serif); font-style: italic; }
.coaster .cdv { font-size: 12.5px; font-weight: 700; }
.coaster .cdv.up { fill: var(--good); } .coaster .cdv.down { fill: var(--bad); }
.coaster .cline-bg { fill: none; stroke: var(--line-2); stroke-width: 2.5; stroke-dasharray: 3 5; }
.coaster .cline { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
.coaster .cdot { fill: var(--accent); stroke: var(--card); stroke-width: 2.5; }
.coaster .cval { font-size: 14px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 4px; }

/* ===================== exercise page ===================== */
.ex-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 14px; }
.ex-head h1 { font-size: clamp(28px, 3vw, 40px); }
.ex-head .lede { margin-top: 4px; font-size: 18px; }
.ex-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.hero { padding: 8px 10px; position: relative; }
.hero .circ { max-height: max(280px, calc(100vh - var(--top) - var(--bot) - 200px)); }
.hero-tools { position: absolute; left: 14px; bottom: 10px; display: flex; gap: 8px; }
.ex-side { display: grid; gap: 14px; }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lvl { text-align: left; border: 1px solid var(--line); background: var(--card-2); border-radius: 11px; padding: 8px 10px; cursor: pointer; font-family: var(--sans); transition: border-color .2s, background .2s; }
.lvl:hover { border-color: var(--line-2); }
.lvl.on { border-color: var(--accent); background: var(--accent-soft); }
.lvl b { display: block; font-size: 14.5px; }
.lvl span { font-size: 12px; color: var(--muted); }

/* ===================== step content ===================== */
.mlines { display: grid; grid-template-columns: minmax(70px, max-content) minmax(0, 1fr) minmax(36px, max-content); column-gap: 14px; row-gap: 2px; align-items: center; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.walk-table { width: 100%; border-collapse: collapse; font-size: 16.5px; }
.walk-table th { font-family: var(--sans); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: left; font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); }

.walk-table td.term { white-space: nowrap; text-align: right; font-size: 18px; }

.badge { display: inline-block; font-family: var(--sans); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 1px 7px; vertical-align: 2px; }
.badge.up { background: var(--good-soft); color: var(--good); } .badge.down { background: var(--bad-soft); color: var(--bad); }
.signs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sign-tile { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card-2); }

details.cheat { border: 1px solid var(--line); border-radius: 12px; background: var(--card-2); padding: 8px 12px; }

.step-card { opacity: 1; }
.step-card.hidden { display: none; }
.step-card.fresh { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
.blk + .blk { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.blk-head { font-family: var(--sans); font-size: 13.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 2px; }
[hidden] { display: none !important; }
.rv-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line-2); }
.rv-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-family: var(--sans); font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.linkbtn { border: 0; background: none; padding: 2px 4px; font: 600 13px var(--sans); color: var(--accent); cursor: pointer; border-radius: 6px; }
.linkbtn:hover { text-decoration: underline; }
.rv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.rv { display: grid; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; perspective: 700px; border-radius: 12px; }
.rv > span { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 58px; padding: 6px 8px; border-radius: 12px; border: 1px solid var(--line-2); font-size: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .55s cubic-bezier(.2, .8, .2, 1), border-color .2s, background .2s; }
.rv-q { border-style: dashed !important; background: repeating-linear-gradient(135deg, var(--card-2) 0 7px, var(--card) 7px 14px); }
.rv-q small { font: 600 10.5px var(--sans); color: var(--muted); letter-spacing: .03em; }
.rv:hover .rv-q { border-color: var(--accent); }
.rv-a { background: var(--card-2); transform: rotateY(180deg); }
.rv.open .rv-q { transform: rotateY(-180deg); }
.rv.open .rv-a { transform: rotateY(0deg); }
.rv:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.peek { display: flex; flex-wrap: wrap; gap: 8px; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }

.tabs button.on { color: var(--accent-ink); font-weight: 600; }
.ptable { width: 100%; border-collapse: collapse; font-size: 16.5px; }
.ptable td, .ptable th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.ptable th { font-family: var(--sans); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ptable td.w { text-align: right; font-family: var(--math); font-size: 18px; white-space: nowrap; }
.ptable tr.tot td { font-weight: 700; border-top: 2px solid var(--line-2); }
.pbars { display: grid; gap: 8px; margin-top: 10px; }
.pbar { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; font-family: var(--sans); font-size: 13px; }
.pbar .track { display: flex; height: 26px; border-radius: 8px; overflow: hidden; background: var(--card-2); border: 1px solid var(--line); }
.pbar .track span { display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; overflow: hidden; white-space: nowrap; transition: flex-grow .6s; }
.recipe { counter-reset: r; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.recipe li { counter-increment: r; display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: start; }
.recipe li::before { content: counter(r); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 700 16px var(--sans); }
.jd { max-width: 460px; margin: 4px auto 6px; }
.jd .jt { font: 600 17px var(--sans); }
.junction-demo svg, .loop-demo svg { width: 100%; height: auto; display: block; }
.slider-row { display: grid; grid-template-columns: 70px 1fr 56px; gap: 10px; align-items: center; font-family: var(--sans); font-size: 14px; }
.slider-row input[type=range] { width: 100%; accent-color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(var(--bot) + 16px); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); font-family: var(--sans); font-size: 14px; padding: 9px 16px; border-radius: 10px; opacity: 0; transition: opacity .25s, transform .25s; z-index: 50; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.focusable-card { transition: border-color .2s, box-shadow .2s; }
.focusable-card:hover { border-color: var(--accent); }
.dimcard { opacity: .72; }
.kbd-hint { font-family: var(--sans); font-size: 12.5px; color: var(--muted); }
</style>
</head>
